<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Jimin Kook - Product-minded Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.58" stop-color="#111C33"/>
      <stop offset="1" stop-color="#15294A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.075"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="26" fill="url(#grid)"/>
  <circle cx="1120" cy="65" r="185" fill="#2563EB" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1045" cy="320" r="135" fill="#14B8A6" opacity="0.11" filter="url(#glow)"/>

  <g transform="translate(72 66)">
    <rect width="58" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="52" fill="#7DD3FC" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4">LIBRUMLEGO / PORTFOLIO</text>
    <text x="-3" y="151" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="1">JIMIN KOOK</text>
    <text x="0" y="201" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="1.5">PRODUCT-MINDED SOFTWARE DEVELOPER</text>
    <text x="0" y="260" fill="#94A3B8" font-family="Arial, sans-serif" font-size="16" letter-spacing="2.2">ANDROID  ·  WEB  ·  AI-INTEGRATED EXPERIENCES</text>
  </g>

  <g transform="translate(1000 118)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="164" height="164" rx="36" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M42 58h80M42 82h54M42 106h68" stroke="#E2E8F0" stroke-width="7" opacity="0.9"/>
    <circle cx="122" cy="106" r="10" fill="#2DD4BF" stroke="none"/>
  </g>

  <text x="1070" y="354" fill="#64748B" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" letter-spacing="3">SHIP · VERIFY · IMPROVE</text>
</svg>
